# FoveaCore Phase 0 통합 설정 (v1.9.3 기준, T1 스키마)
version: "1.9.3"
schema_version: "1.0"
experiment_protocol: STRICT_1SHOT
pretraining_policy: P1

# 센서 구현 전에 확정하는 입력·센서 계약(T1)
input:
  max_side: 1024
  resize_method: adaptive_average
sensor:
  profile: F3
  grid_size: 5
  channels: 4
  stroke_clue_available: true
# 지속 학습 분할: [초기 support 10장], [개발 스트림], [본 실험 학습 스트림] ID 격리 (v1.9.3 Phase 0)
datasets:
  mnist_train: 60000
  mnist_test: 10000
  support_per_episode: 10
  dev_stream: 15000
  main_stream: 35000
  p2_non_digit: null
  non_digit_dev: null
  dev_ood: null
  test_ood: null
  phase7_char_transfer: null

# 합성 데이터: 구조 ID 기준 train/dev/test(70/15/15%)
splits_synthetic:
  train: 70
  dev: 15
  test: 15

# 수량 통일: quick_smoke(1~3 에피소드), phase0_full_smoke(30 에피소드), 10-way 1-shot, n_query_per_class=20
smoke:
  scope: phase0_full_smoke
  quick_episodes: 3
  full_episodes: 30
  way: 10
  n_query_per_class: 20

# 금지 패키지 미설치/미임포트 검증 목록(T1)
forbidden_packages: [transformers, openai, anthropic, llama_cpp, vllm, langchain]
