[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foveacore"
version = "0.1.0"
description = "FoveaCore — 초경량 시각 인지 엔진 (Phase 0~7 단계)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
